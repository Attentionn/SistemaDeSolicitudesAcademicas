<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios y Cursos</title>
    <script>
        async function crearUsuario(tipo) {
            const token = document.getElementById('token').value;
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            let body;

            if (tipo === 'alumno') {
                const studentId = document.getElementById('studentId').value;
                const faculty = document.getElementById('faculty').value;
                body = JSON.stringify({
                    name: nombre,
                    email: email,
                    password: password,
                    role: 'student',
                    studentId: studentId,
                    faculty: faculty
                });
            } else if (tipo === 'profesor') {
                const faculty = document.getElementById('faculty').value;
                body = JSON.stringify({
                    name: nombre,
                    email: email,
                    password: password,
                    role: 'teacher',
                    faculty: faculty
                });
            }

            const response = await fetch(`http://localhost:5000/api/auth/register`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: body
            });

            const data = await response.json();
            if (response.ok) {
                alert('Usuario creado exitosamente: ' + JSON.stringify(data));
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function crearCurso() {
            const token = document.getElementById('token').value;
            const nombre = document.getElementById('cursoNombre').value;
            const codigo = document.getElementById('cursoCodigo').value;
            const descripcion = document.getElementById('cursoDescripcion').value;
            const schedule = document.getElementById('cursoHorario').value;
            const teacherId = document.getElementById('cursoProfesorId').value;

            const body = JSON.stringify({
                name: nombre,
                code: codigo,
                description: descripcion,
                schedule: schedule,
                teacherId: teacherId
            });

            const response = await fetch(`http://localhost:5000/api/courses`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: body
            });

            const data = await response.json();
            if (response.ok) {
                alert('Curso creado exitosamente: ' + JSON.stringify(data));
            } else {
                alert('Error: ' + data.error);
            }
        }

        async function crearFacultad() {
            const token = document.getElementById('token').value;
            const nombre = document.getElementById('facultadNombre').value;
            const descripcion = document.getElementById('facultadDescripcion').value;

            const body = JSON.stringify({
                name: nombre,
                description: descripcion
            });

            const response = await fetch(`http://localhost:5000/api/faculties`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: body
            });

            const data = await response.json();
            if (response.ok) {
                alert('Facultad creada exitosamente: ' + JSON.stringify(data));
            } else {
                alert('Error: ' + data.error);
            }
        }
    </script>
</head>
<body>
    <h1>Gestión de Usuarios y Cursos</h1>
    <label for="token">Token JWT:</label>
    <input type="text" id="token" required><br><br>

    <h2>Crear Alumno</h2>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required><br>
    <label for="email">Email:</label>
    <input type="email" id="email" required><br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" required><br>
    <label for="studentId">Matrícula:</label>
    <input type="text" id="studentId" required><br>
    <label for="faculty">Facultad:</label>
    <input type="text" id="faculty" value="Telematica" required><br>
    <button onclick="crearUsuario('alumno')">Crear Alumno</button>

    <h2>Crear Profesor</h2>
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" required><br>
    <label for="email">Email:</label>
    <input type="email" id="email" required><br>
    <label for="password">Contraseña:</label>
    <input type="password" id="password" required><br>
    <label for="faculty">Facultad:</label>
    <input type="text" id="faculty" value="Telematica" required><br>
    <button onclick="crearUsuario('profesor')">Crear Profesor</button>

    <h2>Crear Curso</h2>
    <label for="cursoNombre">Nombre del Curso:</label>
    <input type="text" id="cursoNombre" required><br>
    <label for="cursoCodigo">Código del Curso:</label>
    <input type="text" id="cursoCodigo" required><br>
    <label for="cursoDescripcion">Descripción:</label>
    <input type="text" id="cursoDescripcion" required><br>
    <label for="cursoHorario">Horario:</label>
    <input type="text" id="cursoHorario" required><br>
    <label for="cursoProfesorId">ID del Profesor:</label>
    <input type="text" id="cursoProfesorId" required><br>
    <button onclick="crearCurso()">Crear Curso</button>

    <h2>Crear Facultad</h2>
    <label for="facultadNombre">Nombre de la Facultad:</label>
    <input type="text" id="facultadNombre" required><br>
    <label for="facultadDescripcion">Descripción:</label>
    <input type="text" id="facultadDescripcion" required><br>
    <button onclick="crearFacultad()">Crear Facultad</button>
</body>
</html>
